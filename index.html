<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Sua vida de freelancer, organizada: agenda, pagamentos e MEI." />
    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/app/icons/icon-192.png" />
    <title>Controle de Freelas</title>
  </head>
  <body>
    <div id="root">
      <!-- Conteúdo estático de fallback: visível para rastreadores sem JS
           (ex: verificador do Google) e substituído pelo app ao carregar. -->
      <div style="font-family: sans-serif; text-align: center; padding: 40px 16px; color: #333;">
        <h1>Controle de Freelas</h1>
        <p>Sua vida de freelancer, organizada: agenda, pagamentos e MEI.</p>
        <p>
          <a href="/app/politica-privacidade.html">Política de Privacidade</a> •
          <a href="/app/termos-servico.html">Termos de Serviço</a>
        </p>
      </div>
    </div>
    <div id="modal-root"></div>
    
    <!-- Carregar Google APIs -->
    <script>
      (function() {
        const loadScript = (src) => {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => {
              console.log('✅ Loaded:', src);
              resolve();
            };
            script.onerror = () => {
              console.error('❌ Failed to load:', src);
              reject(new Error('Failed to load: ' + src));
            };
            document.head.appendChild(script);
          });
        };

        // Carregar GAPI e GSI em paralelo
        Promise.all([
          loadScript('https://apis.google.com/js/api.js'),
          loadScript('https://accounts.google.com/gsi/client')
        ])
          .then(() => {
            console.log('✅ All Google scripts loaded successfully');
          })
          .catch((error) => {
            console.error('❌ Error loading Google scripts:', error);
            alert('Erro ao carregar Google APIs. Recarregue a página.');
          });
      })();
    </script>
    
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
