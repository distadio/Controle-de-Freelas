# .github/workflows/deploy.yml
name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build project
        run: npm run build
        env:
          CI: false
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: 📄 Create .htaccess for SPA routing
        run: |
          echo "<IfModule mod_rewrite.c>" > dist/.htaccess
          echo "  RewriteEngine On" >> dist/.htaccess
          echo "  RewriteBase /app/" >> dist/.htaccess
          echo "  RewriteCond %{REQUEST_FILENAME} !-f" >> dist/.htaccess
          echo "  RewriteCond %{REQUEST_FILENAME} !-d" >> dist/.htaccess
          echo "  RewriteRule . /app/index.html [L]" >> dist/.htaccess
          echo "</IfModule>" >> dist/.htaccess

      - name: 🚀 Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-late: true
          log-level: verbose